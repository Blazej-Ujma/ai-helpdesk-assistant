<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Helpdesk Assistant</title>
</head>
<body>
    <header>
        <h1>AI Helpdesk Assistant</h1>
        <p>Describe your IT problem and get help.</p>
    </header>

    <main>
        <section>
            <h2>Support Chat</h2>

            <div id="chat-messages">
                <p>Hello! How can I help you today?</p>
            </div>

            <form id="chat-form">
                <label for="user-message">Your message</label>
                <input
                    type="text"
                    id="user-message"
                    name="user-message"
                    placeholder="Describe your IT problem..."
                >
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
</body>
</html>
